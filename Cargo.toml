[package]
name = "syncloom-server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Sven Walther <sven@syncloom.de>"]
repository = "https://github.com/Syncloom/syncloom-server"
description = "Syncloom server: accounts, encrypted file/KV storage, sharing and change feed"

[lib]
name = "syncloom_server"
path = "src/lib.rs"

[[bin]]
name = "syncloom-server"
path = "src/main.rs"

[dependencies]
syncloom-core = { path = "../syncloom-core", default-features = false, features = ["grpc"] }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = "0.12"
tonic-web = "0.12"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "limit"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
blake3 = "1"
subtle = "2"
totp-rs = { version = "5", features = ["otpauth", "gen_secret"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "danger-user-presence-only-security-keys"] }
openidconnect = "3"
object_store = { version = "0.11", features = ["aws"] }
bytes = "1"
futures = "0.3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
futures = "0.3"
syncloom-core = { path = "../syncloom-core", features = ["client"] }
tempfile = "3"
totp-rs = { version = "5", features = ["otpauth"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softtoken"] }
